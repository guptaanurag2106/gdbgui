<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gdbgui - gdb in a browser</title>
    <base target="_blank" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <link href="static/vendor/css/bootstrap.min.css" rel="stylesheet" />
  
    {% for theme in themes %}
        <link href="static/vendor/css/pygments/{{theme}}.css" rel="stylesheet" />
    {% endfor %}
    <script type="text/javascript" src="static/vendor/js/jquery.min.js" defer></script>
    <script type="text/javascript" src="static/vendor/js/bootstrap.min.js" defer></script>
    <script type="text/javascript" src="static/vendor/js/vis-4.20.1.min.js" defer></script>
    <script type="text/javascript" src="static/vendor/js/splitjs.min-1.2.0.js" defer></script>

    <script>
        initial_data = {{initial_data | tojson}}
        debug = {{debug | tojson}}
    </script>
    <script type="text/javascript" src="static/js/main.js?_={{version}}" defer></script>
  </head>

  <body style="background-color: #333;">
      <div id="gdbgui" class="splitjs_container">
          <div style="text-align: center; color: #ccc;">
              <h3>Loading application, please wait.</h3>
              <p>
              Note: JavaScript and cookies must be enabled.
              </p>
          </div>
      </div>
  </body>
</html>
